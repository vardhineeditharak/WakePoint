name: Build WakePoint Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🏷️ Auto-Increment VersionCode & Extract Version
        id: version_info
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=${{ github.run_number }}" >> $GITHUB_OUTPUT
          
          # Inject GitHub run_number into Android versionCode in app.json
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            app.expo.android.versionCode = ${{ github.run_number }};
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2));
            console.log('Configured Android versionCode:', ${{ github.run_number }});
          "

      - name: 🏗️ Generate Native Android Project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: ⚙️ Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 📦 Prepare Release Artifact
        run: |
          mkdir -p build_output
          cp android/app/build/outputs/apk/release/app-release.apk "build_output/WakePoint-v${{ steps.version_info.outputs.version }}-build-${{ steps.version_info.outputs.build_number }}.apk"

      - name: 📤 Upload APK Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: "WakePoint-v${{ steps.version_info.outputs.version }}-build-${{ steps.version_info.outputs.build_number }}-APK"
          path: "build_output/WakePoint-v${{ steps.version_info.outputs.version }}-build-${{ steps.version_info.outputs.build_number }}.apk"
          retention-days: 30
